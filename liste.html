<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des Inscriptions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="text-center text-primary mb-4">Liste des Inscriptions</h1>

  <!-- Bouton de téléchargement en PDF -->
  <button class="btn btn-info mb-4" onclick="telechargerPDF()">Télécharger en PDF</button>
  
  <div class="table-responsive">
    <table class="table table-bordered table-striped table-hover align-middle text-center" id="tableInscriptions">
      <thead class="table-primary">
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Téléphone</th>
          <th>Catégorie</th>
          <th>Groupe</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbodyInscriptions"></tbody>
    </table>
  </div>
  
  <!-- Bouton de retour -->
  <a href="index.html" class="btn btn-primary mt-4">Retour à l'index</a>
</div>

<!-- Modal de modification -->
<div class="modal fade" id="modalModifier" tabindex="-1" aria-labelledby="modifierLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formModifier">
        <div class="modal-header">
          <h5 class="modal-title text-primary" id="modifierLabel">Modifier une inscription</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="indexModifier">
          <div class="mb-3">
            <label>Nom</label>
            <input type="text" class="form-control" id="nomModifier" required>
          </div>
          <div class="mb-3">
            <label>Prénom</label>
            <input type="text" class="form-control" id="prenomModifier" required>
          </div>
          <div class="mb-3">
            <label>Téléphone</label>
            <input type="tel" class="form-control" id="telephoneModifier" required>
          </div>
          <div class="mb-3">
            <label>Catégorie</label>
            <select class="form-select" id="categorieModifier" required>
              <option>50 000 FCFA</option>
              <option>30 000 FCFA</option>
              <option>25 000 FCFA</option>
              <option>15 000 FCFA</option>
              <option>10 000 FCFA</option>
              <option>5 000 FCFA</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Groupe</label>
            <select class="form-select" id="groupeModifier" required>
              <option>Kourel 1</option>
              <option>Kourel 2</option>
              <option>Membre Femme</option>
              <option>Membre Homme</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Enregistrer</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Afficher les inscriptions par catégorie
  function afficherInscriptions() {
    const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
    const tbody = document.getElementById("tbodyInscriptions");
    tbody.innerHTML = "";

    // Grouper les inscriptions par catégorie
    const groupes = inscriptions.reduce((acc, inscription) => {
      const categorie = inscription.categorie;
      if (!acc[categorie]) {
        acc[categorie] = [];
      }
      acc[categorie].push(inscription);
      return acc;
    }, {});

    // Afficher les inscriptions sous chaque catégorie
    for (let categorie in groupes) {
      const group = groupes[categorie];
      
      // Ajouter une ligne pour la catégorie
      const trCategorie = document.createElement("tr");
      const tdCategorie = document.createElement("td");
      tdCategorie.colSpan = 6;
      tdCategorie.classList.add("table-secondary");
      tdCategorie.textContent = `Catégorie: ${categorie}`;
      trCategorie.appendChild(tdCategorie);
      tbody.appendChild(trCategorie);

      // Afficher les inscriptions de cette catégorie
      group.forEach((inscription, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${inscription.nom}</td>
          <td>${inscription.prenom}</td>
          <td>${inscription.telephone}</td>
          <td>${inscription.categorie}</td>
          <td>${inscription.groupe}</td>
          <td>
            <button class="btn btn-warning btn-sm me-1" onclick="modifierInscription(${index})">Modifier</button>
            <button class="btn btn-danger btn-sm" onclick="supprimerInscription(${index})">Supprimer</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  }

  // Supprimer une inscription
  function supprimerInscription(index) {
    const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
    inscriptions.splice(index, 1);
    localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
    afficherInscriptions();
  }

  // Remplir et afficher le modal de modification
  function modifierInscription(index) {
    const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
    const data = inscriptions[index];

    document.getElementById("indexModifier").value = index;
    document.getElementById("nomModifier").value = data.nom;
    document.getElementById("prenomModifier").value = data.prenom;
    document.getElementById("telephoneModifier").value = data.telephone;
    document.getElementById("categorieModifier").value = data.categorie;
    document.getElementById("groupeModifier").value = data.groupe;

    const modal = new bootstrap.Modal(document.getElementById("modalModifier"));
    modal.show();
  }

  // Soumettre le formulaire de modification
  document.getElementById("formModifier").addEventListener("submit", function(e) {
    e.preventDefault();
    const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
    const index = document.getElementById("indexModifier").value;

    inscriptions[index] = {
      nom: document.getElementById("nomModifier").value.trim(),
      prenom: document.getElementById("prenomModifier").value.trim(),
      telephone: document.getElementById("telephoneModifier").value.trim(),
      categorie: document.getElementById("categorieModifier").value,
      groupe: document.getElementById("groupeModifier").value
    };

    localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
    bootstrap.Modal.getInstance(document.getElementById("modalModifier")).hide();
    afficherInscriptions();
  });

  // Fonction pour télécharger en PDF sans les boutons de modification et suppression
  function telechargerPDF() {
    // Masquer les boutons Modifier et Supprimer
    const boutons = document.querySelectorAll(".btn-warning, .btn-danger");
    boutons.forEach(btn => btn.style.display = "none");

    // Obtenir l'élément du tableau
    const element = document.getElementById('tableInscriptions');

    // Définir les options de conversion en PDF
    const opt = {
      margin:       1,
      filename:     'Inscriptions.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // Générer le PDF
    html2pdf().from(element).set(opt).save().then(() => {
      // Restaurer l'affichage des boutons après l'exportation
      boutons.forEach(btn => btn.style.display = "");
    });
  }

  // Initialiser l'affichage
  afficherInscriptions();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
