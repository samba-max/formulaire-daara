<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Inscriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }
        .link-btn {
            text-decoration: none;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
        .link-btn:hover {
            background-color: #0056b3;
        }
        .modal-body input {
            margin-bottom: 10px;
        }
        /* Ajouter des marges pour un meilleur espacement sur mobile */
        .container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .card-body {
            padding: 15px;
        }
        /* Adapter le tableau pour les petits écrans */
        @media (max-width: 768px) {
            .table th, .table td {
                font-size: 0.9rem;
            }
            .modal-dialog {
                max-width: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Liste des Inscrits</h3>
            <div id="inscriptions"></div>

            <div class="text-end mt-3">
                <a href="index.html" class="link-btn">Retour à l'inscription</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal de modification -->
<div class="modal fade" id="modifierModal" tabindex="-1" aria-labelledby="modifierModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modifierModalLabel">Modifier l'inscription</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="modifierForm">
                    <input type="text" id="nom" class="form-control" placeholder="Nom" required>
                    <input type="text" id="prenom" class="form-control" placeholder="Prénom" required>
                    <input type="text" id="telephone" class="form-control" placeholder="Téléphone" required>
                    <input type="text" id="categorie" class="form-control" placeholder="Catégorie" required>
                    <input type="text" id="groupe" class="form-control" placeholder="Groupe" required>
                    <input type="hidden" id="indexToModify">
                    <button type="submit" class="btn btn-primary mt-3 w-100">Sauvegarder</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    let inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];

    function afficherInscriptions() {
        const container = document.getElementById("inscriptions");
        if (inscriptions.length === 0) {
            container.innerHTML = "<p class='text-muted'>Aucune inscription pour le moment.</p>";
            return;
        }

        let html = `<table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Catégorie</th>
                    <th>Groupe</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>`;

        inscriptions.forEach((i, index) => {
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${i.nom}</td>
                    <td>${i.prenom}</td>
                    <td>${i.telephone}</td>
                    <td>${i.categorie}</td>
                    <td>${i.groupe}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-1" onclick="modifierInscription(${index})">Modifier</button>
                        <button class="btn btn-sm btn-danger" onclick="supprimerInscription(${index})">Supprimer</button>
                    </td>
                </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function modifierInscription(index) {
        let inscription = inscriptions[index];
        document.getElementById("nom").value = inscription.nom;
        document.getElementById("prenom").value = inscription.prenom;
        document.getElementById("telephone").value = inscription.telephone;
        document.getElementById("categorie").value = inscription.categorie;
        document.getElementById("groupe").value = inscription.groupe;
        document.getElementById("indexToModify").value = index;

        let modal = new bootstrap.Modal(document.getElementById('modifierModal'));
        modal.show();
    }

    function supprimerInscription(index) {
        if (confirm("Voulez-vous vraiment supprimer cette inscription ?")) {
            inscriptions.splice(index, 1);
            localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
            afficherInscriptions();
        }
    }

    document.getElementById("modifierForm").addEventListener("submit", function(event) {
        event.preventDefault();
        let index = document.getElementById("indexToModify").value;
        let inscription = inscriptions[index];

        inscription.nom = document.getElementById("nom").value;
        inscription.prenom = document.getElementById("prenom").value;
        inscription.telephone = document.getElementById("telephone").value;
        inscription.categorie = document.getElementById("categorie").value;
        inscription.groupe = document.getElementById("groupe").value;

        localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
        afficherInscriptions();

        let modal = bootstrap.Modal.getInstance(document.getElementById('modifierModal'));
        modal.hide();
    });

    afficherInscriptions();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
