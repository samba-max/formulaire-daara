<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Inscriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }
        .link-btn {
            text-decoration: none;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
        .link-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Liste des Inscrits</h3>
            <div id="inscriptions"></div>

            <div class="text-end mt-3">
                <a href="index.html" class="link-btn">Retour à l'inscription</a>
            </div>
        </div>
    </div>
</div>

<script>
    let inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];

    function afficherInscriptions() {
        const container = document.getElementById("inscriptions");
        if (inscriptions.length === 0) {
            container.innerHTML = "<p class='text-muted'>Aucune inscription pour le moment.</p>";
            return;
        }

        let html = `<table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Catégorie</th>
                    <th>Groupe</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>`;

        inscriptions.forEach((i, index) => {
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${i.nom}</td>
                    <td>${i.prenom}</td>
                    <td>${i.telephone}</td>
                    <td>${i.categorie}</td>
                    <td>${i.groupe}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-1" onclick="modifierInscription(${index})">Modifier</button>
                        <button class="btn btn-sm btn-danger" onclick="supprimerInscription(${index})">Supprimer</button>
                    </td>
                </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function modifierInscription(index) {
        let inscription = inscriptions[index];
        alert(`Modifier l'inscription de ${inscription.nom} ${inscription.prenom}`);
    }

    function supprimerInscription(index) {
        if (confirm("Voulez-vous vraiment supprimer cette inscription ?")) {
            inscriptions.splice(index, 1);
            localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
            afficherInscriptions();
        }
    }

    afficherInscriptions();
</script>

</body>
</html>
