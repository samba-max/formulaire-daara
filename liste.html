<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste des Inscriptions Daara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f9ff;
    }
    .table th, .table td {
      vertical-align: middle;
    }
    .table-secondary {
      background-color: #007bff !important;
      color: white;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-warning {
      color: black;
    }
  </style>
</head>
<body>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="text-primary">Liste des Inscriptions</h2>
      <button class="btn btn-primary" onclick="telechargerPDF()">Télécharger PDF</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered" id="tableInscriptions">
        <thead class="table-light">
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Téléphone</th>
            <th>Catégorie</th>
            <th>Groupe</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbodyInscriptions"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Modifier -->
  <div class="modal fade" id="modalModifier" tabindex="-1" aria-labelledby="modalModifierLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formModifier">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Modifier l'inscription</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="indexModifier">
          <div class="mb-3">
            <label for="nomModifier" class="form-label">Nom</label>
            <input type="text" class="form-control" id="nomModifier" required>
          </div>
          <div class="mb-3">
            <label for="prenomModifier" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="prenomModifier" required>
          </div>
          <div class="mb-3">
            <label for="telephoneModifier" class="form-label">Téléphone</label>
            <input type="tel" class="form-control" id="telephoneModifier" required>
          </div>
          <div class="mb-3">
            <label for="categorieModifier" class="form-label">Catégorie</label>
            <select class="form-select" id="categorieModifier" required>
              <option value="50000 FCFA">50000 FCFA</option>
              <option value="30000 FCFA">30000 FCFA</option>
              <option value="20000 FCFA">20000 FCFA</option>
              <option value="10000 FCFA">10000 FCFA</option>
              <option value="5000 FCFA">5000 FCFA</option>
              <option value="Autres">Autres</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="groupeModifier" class="form-label">Groupe</label>
            <input type="text" class="form-control" id="groupeModifier" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tbody = document.getElementById("tbodyInscriptions");
      const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];

      // Grouper par catégorie
      const groupesParCategorie = {};
      inscriptions.forEach((inscription, index) => {
        const cat = inscription.categorie;
        if (!groupesParCategorie[cat]) {
          groupesParCategorie[cat] = [];
        }
        groupesParCategorie[cat].push({ ...inscription, index });
      });

      // Affichage
      for (const categorie in groupesParCategorie) {
        const group = groupesParCategorie[categorie];

        // Titre de catégorie
        const trCat = document.createElement("tr");
        trCat.innerHTML = `<td colspan="6" class="table-secondary fw-bold text-start">${categorie}</td>`;
        tbody.appendChild(trCat);

        // Lignes de données
        group.forEach(({ nom, prenom, telephone, groupe, index }) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${nom}</td>
            <td>${prenom}</td>
            <td>${telephone}</td>
            <td>${categorie}</td>
            <td>${groupe}</td>
            <td>
              <button class="btn btn-sm btn-warning me-1" onclick="ouvrirModal(${index})">Modifier</button>
              <button class="btn btn-sm btn-danger" onclick="supprimerInscription(${index})">Supprimer</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    });

    // Ouvrir le modal
    function ouvrirModal(index) {
      const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
      const ins = inscriptions[index];

      document.getElementById("indexModifier").value = index;
      document.getElementById("nomModifier").value = ins.nom;
      document.getElementById("prenomModifier").value = ins.prenom;
      document.getElementById("telephoneModifier").value = ins.telephone;
      document.getElementById("categorieModifier").value = ins.categorie;
      document.getElementById("groupeModifier").value = ins.groupe;

      new bootstrap.Modal(document.getElementById("modalModifier")).show();
    }

    // Modifier
    document.getElementById("formModifier").addEventListener("submit", function (e) {
      e.preventDefault();
      const index = document.getElementById("indexModifier").value;
      const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];

      inscriptions[index] = {
        nom: document.getElementById("nomModifier").value,
        prenom: document.getElementById("prenomModifier").value,
        telephone: document.getElementById("telephoneModifier").value,
        categorie: document.getElementById("categorieModifier").value,
        groupe: document.getElementById("groupeModifier").value,
      };

      localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
      window.location.reload();
    });

    // Supprimer
    function supprimerInscription(index) {
      if (confirm("Voulez-vous vraiment supprimer cette inscription ?")) {
        const inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];
        inscriptions.splice(index, 1);
        localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
        window.location.reload();
      }
    }

    // Télécharger PDF
    function telechargerPDF() {
      const element = document.getElementById("tableInscriptions");
      const opt = {
        margin: 0.5,
        filename: 'liste_inscriptions.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
