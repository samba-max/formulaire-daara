<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription Daara Tazawoudou Sikhar 2025</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    /* Arrière-plan animé */
    body {
      background: linear-gradient(-45deg, #cde5ff, #f0f8ff, #e0f7ff, #ffffff);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradient {
      0% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100% { background-position: 0% 50% }
    }

    /* Carte centrale glassmorphique */
    .form-container {
      backdrop-filter: blur(15px);
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 500px;
    }

    h3 {
      color: #0056b3;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: 500;
      color: #003366;
    }

    .form-select, .form-control {
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #ced4da;
    }

    .btn-custom {
      background-color: #007bff;
      border: none;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      color: white;
      transition: 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #0056b3;
    }

    .link-btn {
      color: #0056b3;
      font-weight: bold;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #004080;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-container img {
      max-height: 200px;
      border-radius: 15px;
      display: block;
      margin: 0 auto 20px;
    }

    @media (max-width: 576px) {
      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="header-title">Sou euleugue Ken dou fay wax bayi dieuf</div>
    <img src="IMG_9592.jpg" alt="Daara" />

    <h3>Formulaire d'inscription</h3>

    <form id="form-inscription">
      <div class="mb-3">
        <label>Nom</label>
        <input type="text" id="nom" class="form-control" required />
      </div>

      <div class="mb-3">
        <label>Prénom</label>
        <input type="text" id="prenom" class="form-control" required />
      </div>

      <div class="mb-3">
        <label>Numéro de téléphone</label>
        <input type="tel" id="telephone" class="form-control" required pattern="[0-9]{9}" />
      </div>

      <div class="mb-3">
        <label>Catégorie</label>
        <select id="categorie" class="form-select" required>
          <option value="">-- Choisir --</option>
          <option>50 000 FCFA</option>
          <option>30 000 FCFA</option>
          <option>25 000 FCFA</option>
          <option>15 000 FCFA</option>
          <option>10 000 FCFA</option>
          <option>5 000 FCFA</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Groupe</label>
        <select id="groupe" class="form-select" required>
          <option value="">-- Choisir --</option>
          <option>Kourel 1</option>
          <option>Kourel 2</option>
          <option>Membre Femme</option>
          <option>Membre Homme</option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-custom">Envoyer</button>
        <button type="reset" class="btn btn-secondary">Annuler</button>
      </div>
    </form>

    <div id="message" class="mt-3"></div>

    <a href="#" class="link-btn" id="btn-dirigeant">Accès Dirigeant</a>
  </div>

  <script>
    document.getElementById("form-inscription").addEventListener("submit", function(event) {
      event.preventDefault();

      let nom = document.getElementById("nom").value.trim();
      let prenom = document.getElementById("prenom").value.trim();
      let telephone = document.getElementById("telephone").value.trim();
      let categorie = document.getElementById("categorie").value.trim();
      let groupe = document.getElementById("groupe").value.trim();

      if (nom && prenom && telephone && categorie && groupe) {
        let inscriptions = JSON.parse(localStorage.getItem("inscriptions")) || [];

        let duplicate = inscriptions.some(i => i.nom === nom && i.telephone === telephone);
        if (duplicate) {
          document.getElementById("message").innerHTML = "<div class='alert alert-warning'>Cette personne est déjà inscrite.</div>";
        } else {
          let inscription = {
            nom,
            prenom,
            telephone,
            categorie,
            groupe
          };
          inscriptions.push(inscription);
          localStorage.setItem("inscriptions", JSON.stringify(inscriptions));
          document.getElementById("message").innerHTML = "<div class='alert alert-success'>Inscription enregistrée avec succès !</div>";
          document.getElementById("form-inscription").reset();
        }
      } else {
        document.getElementById("message").innerHTML = "<div class='alert alert-danger'>Veuillez remplir tous les champs !</div>";
      }
    });

    document.getElementById("btn-dirigeant").addEventListener("click", function(event) {
      event.preventDefault();
      let motDePasse = prompt("Entrez le mot de passe pour accéder au dirigeant:");
      if (motDePasse === "daara2025") {
        window.location.href = "liste.html";
      } else {
        alert("Mot de passe incorrect.");
      }
    });
  </script>

</body>
</html>
